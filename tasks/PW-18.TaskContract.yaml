  affects:
    - default/pagewell/api-edge
    - default/pagewell/identity-worker
    - default/pagewell/membership-worker
    - default/pagewell/web-console-next
    - default/pagewell/web-console-next-tests
    - apps/api-edge/wrangler.template.jsonc
    - apps/identity-worker/wrangler.template.jsonc
    - apps/membership-worker/wrangler.template.jsonc
    - apps/web-console-next/**
    - tests/web-console-next/**
    - specs/epics/pagewell-pdf-workspace/**
    - ai/context/**
    - tasks/**
  deps: [PW-17]
  doneWhen:
    - On stage, org members and invitations routes answer (not 404) and a new user creates their first org at onboarding
    - The console shows Members and invitations; an org's home is its Drive; Projects is not in Pagewell's nav
    - Existing tests pass for both profiles
  gates: []
