apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: files-worker
  description: Pagewell's drive — folders, documents, versions, uploads, trash and quotas over D1 and R2
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: pagewell
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: pagewell-drive
  path: apps/files-worker
  dependsOn:
    - component: membership-worker
    - component: policy-worker
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: billing-worker
    - component: cloudflare-d1
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: cloudflare-r2
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  secretEnv:
    WIRING_CLOUDFLARE_D1_STAGE: "secret://ws_52SNF622/pagewell/stage/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_D1_PROD: "secret://ws_52SNF622/pagewell/prod/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_R2_STAGE: "secret://ws_52SNF622/pagewell/stage/WIRING_CLOUDFLARE_R2"
    WIRING_CLOUDFLARE_R2_PROD: "secret://ws_52SNF622/pagewell/prod/WIRING_CLOUDFLARE_R2"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        # Peer edges are runtime calls, not deploy order: every binding target
        # exists before this deploys (policy-worker's pre-deploy places one,
        # tooling/deploy/fleet-stubs.mjs), so nothing in this lane waits on a
        # peer. The edges marked `mode: enforced` above still order.
        dependencyMode: advisory
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        dependencyMode: advisory
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    orgName: sourceplane
    owner: sourceplane
    repo: pagewell

    turboFilter: "@saas/files-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-d1,cloudflare-r2"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/files-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/files-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'Migrations run in the db-migrate component.'"
    smokeCommand: "echo 'No public route; exercised through api-edge.'"
  labels:
    team: pagewell
    layer: runtime
    surface: files
    runtime: cloudflare
