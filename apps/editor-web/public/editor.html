<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagewell editor</title>
  <meta name="description" content="Edit a PDF in your browser with Pagewell.">
  <meta name="pagewell-api" content="__API_ORIGIN__">
  <meta name="pagewell-console" content="__CONSOLE_ORIGIN__">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/editor.css">
  <link rel="modulepreload" href="/pkg/__PKG__/pagewell_web_bridge.js">
  <script type="module" src="/editor.js" data-pkg="__PKG__"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/edit/local" aria-label="Pagewell">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 2h9l5 5v15H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 13h8M9 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Pagewell</span>
    </a>
    <div class="actions">
      <label class="button" id="open-label">Open PDF<input id="open" type="file" accept="application/pdf,.pdf" hidden></label>
      <button class="button" id="save" type="button" disabled>Save</button>
      <button class="button" id="undo" type="button" disabled title="Undo the last assistant edit">Undo</button>
      <button class="button" id="download" type="button" hidden>Download</button>
    </div>
    <output id="status" role="status" aria-live="polite">Loading the editor…</output>
  </header>
  <main class="stage">
    <canvas id="editor" tabindex="0" aria-label="PDF editor"></canvas>
  </main>
  <dialog id="conflict" aria-labelledby="conflict-title">
    <form method="dialog">
      <h2 id="conflict-title">Someone saved a newer version</h2>
      <p id="conflict-text">Version <span id="conflict-version"></span> was saved while you were editing. Your changes are still here.</p>
      <div class="dialog-actions">
        <button class="button" value="copy" type="submit">Save as a copy</button>
        <button class="button" value="reload" type="submit">Reload, discarding my changes</button>
        <button class="button" value="cancel" type="submit">Keep editing</button>
      </div>
    </form>
  </dialog>
  <dialog id="link-password" aria-labelledby="link-password-title">
    <form method="dialog">
      <h2 id="link-password-title">This link has a password</h2>
      <p id="link-password-text">Enter the password the person who shared it gave you.</p>
      <input id="link-password-input" type="password" autocomplete="off" aria-label="Link password" required minlength="1" maxlength="200">
      <div class="dialog-actions">
        <button class="button" value="ok" type="submit">Open</button>
        <button class="button" value="cancel" type="submit" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="link-folder" aria-labelledby="link-folder-title">
    <form method="dialog">
      <h2 id="link-folder-title">Shared folder</h2>
      <p id="link-folder-path"></p>
      <ul id="link-folder-list" class="link-list"></ul>
      <div class="dialog-actions">
        <button class="button" value="cancel" type="submit">Close</button>
      </div>
    </form>
  </dialog>
  <noscript>The Pagewell editor needs JavaScript and WebAssembly.</noscript>
</body>
</html>
