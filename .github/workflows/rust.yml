# Pagewell's Rust lane: the product crates (crates/pagewell-*) against the vendored PdfCraft.
# Separate from ci.yml (orun's plan and convergence), which owns deployment.
name: rust

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/**"
      - "crates/**"
      - "vendor/pdfcraft/**"
      - ".github/workflows/rust.yml"
      - "apps/editor-web/scripts/editor-artifact.mjs"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "crates/**"
      - "vendor/pdfcraft/**"
      - ".github/workflows/rust.yml"
      - "apps/editor-web/scripts/editor-artifact.mjs"
  # Publish the editor bundle from a branch (its hash names the Rust sources, so a bundle
  # built anywhere is the same bundle).
  workflow_dispatch:
    inputs:
      size:
        description: "Also measure the size experiments (wasm-opt, opt-level z)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Must equal the wasm-bindgen crate pinned in Cargo.toml.
  WASM_BINDGEN_VERSION: "0.2.129"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pagewell-native
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # Publishes the editor bundle to the `editor-artifacts` release (main and dispatch only).
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pagewell-wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: Build the bridge for wasm32
        run: cargo build --release --locked --target wasm32-unknown-unknown -p pagewell-web-bridge
      - name: Generate the JS module
        run: wasm-bindgen --target web --remove-name-section --remove-producers-section --out-dir dist/editor target/wasm32-unknown-unknown/release/pagewell_web_bridge.wasm
      - name: Sizes
        run: |
          cd dist/editor
          {
            echo "### Editor bundle"
            echo "| file | raw | gzip -9 | brotli |"
            echo "|---|---:|---:|---:|"
            for f in *; do
              echo "| $f | $(stat -c%s "$f") | $(gzip -9c "$f" | wc -c) | $(brotli -c -q 11 "$f" 2>/dev/null | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pagewell-editor-wasm
          path: dist/editor
          retention-days: 7
      - name: Pack the editor bundle
        id: pack
        run: |
          node apps/editor-web/scripts/editor-artifact.mjs pack --in dist/editor --out dist/packed | tee pack.log
          echo "json=$(tail -1 pack.log)" >> "$GITHUB_OUTPUT"
          { echo; echo '### Packed bundle'; echo; echo '```'; cat pack.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Content-addressed on one rolling release: an asset is only ever the build of the sources
      # its name hashes, so publishing is skip-if-present. apps/editor-web pins the asset.
      - name: Publish the editor bundle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ fromJSON(steps.pack.outputs.json).asset }}
        run: |
          gh release view editor-artifacts >/dev/null 2>&1 || \
            gh release create editor-artifacts --prerelease --title "Editor bundles" \
              --notes "Prebuilt Pagewell editor bundles (crates/pagewell-web-bridge), named by the hash of the Rust sources. apps/editor-web pins one by sha256."
          if gh release view editor-artifacts --json assets -q '.assets[].name' | grep -qx "$ASSET"; then
            echo "$ASSET is already published"
          else
            gh release upload editor-artifacts "dist/packed/$ASSET" "dist/packed/$ASSET.sha256"
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/editor-artifacts/$ASSET"
          { echo; echo "Published: $url"; } >> "$GITHUB_STEP_SUMMARY"

  # PW-8: how small can the editor get? Dispatch only. Each variant builds the bridge, strips
  # names, runs binaryen's wasm-opt -Oz and reports raw, gzip and brotli to the step summary.
  # Profile settings come from CARGO_PROFILE_* so Cargo.toml (and the bundle's source hash)
  # stay as they are until a variant is adopted.
  size:
    name: size · ${{ matrix.variant }}
    if: github.event_name == 'workflow_dispatch' && inputs.size
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            opt: "3"
            lto: thin
          - variant: opt-z-fat-lto
            opt: z
            lto: fat
    env:
      BINARYEN_VERSION: version_133
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt }}
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pagewell-size-${{ matrix.variant }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: binaryen (pinned, checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          gh release download "$BINARYEN_VERSION" -R WebAssembly/binaryen -p "$f" -p "$f.sha256" -D "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha256sum -c "$f.sha256")
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Build the bridge for wasm32
        run: cargo build --release --locked --target wasm32-unknown-unknown -p pagewell-web-bridge
      - name: Strip and optimise
        run: |
          wasm-bindgen --target web --remove-name-section --remove-producers-section --out-dir out target/wasm32-unknown-unknown/release/pagewell_web_bridge.wasm
          /usr/bin/time -v wasm-opt -Oz --all-features --strip-debug --strip-producers \
            -o out/oz.wasm out/pagewell_web_bridge_bg.wasm 2> wasm-opt.time
          grep -E 'Elapsed|Maximum resident' wasm-opt.time
      - name: Sizes
        run: |
          size() { node -e '
            const z=require("zlib"),b=require("fs").readFileSync(process.argv[1]);
            const br=z.brotliCompressSync(b,{params:{[z.constants.BROTLI_PARAM_QUALITY]:11,[z.constants.BROTLI_PARAM_LGWIN]:24,[z.constants.BROTLI_PARAM_SIZE_HINT]:b.length}});
            console.log(`| ${process.argv[2]} | ${b.length} | ${z.gzipSync(b,{level:9}).length} | ${br.length} |`)' "$1" "$2"; }
          {
            echo "### ${{ matrix.variant }} (opt-level ${{ matrix.opt }}, lto ${{ matrix.lto }})"
            echo "| wasm | raw | gzip -9 | brotli 11 |"
            echo "|---|---:|---:|---:|"
            size out/pagewell_web_bridge_bg.wasm "names stripped"
            size out/oz.wasm "+ wasm-opt -Oz"
          } | tee -a "$GITHUB_STEP_SUMMARY"
