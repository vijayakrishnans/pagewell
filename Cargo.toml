# Pagewell's Rust workspace: product crates only (crates/pagewell-*). PdfCraft is vendored,
# unmodified apart from vendor/UPSTREAM-PATCHES.md, at vendor/pdfcraft/ and used by path; it keeps
# its own workspace, which is excluded here.
#
# Kept in step with vendor/pdfcraft/Cargo.toml on every PDFCRAFT_REF bump (one task):
#   - [patch.crates-io] below is that file's, with vendored paths prefixed vendor/pdfcraft/;
#   - [profile.*] mirrors it;
#   - Cargo.lock started as a copy of vendor/pdfcraft/Cargo.lock, so the engine resolves to the
#     versions upstream tested.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/pdfcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
publish = false
repository = "https://github.com/vijayakrishnans/pagewell"

[workspace.dependencies]
pdfcraft-automation = { path = "vendor/pdfcraft/crates/automation", default-features = false }
pdfcraft-engine = { path = "vendor/pdfcraft/crates/engine" }
pdfcraft-ui-egui = { path = "vendor/pdfcraft/crates/ui-egui" }
eframe = { version = "0.37", default-features = false }
egui = "0.37"
serde_json = "1"
# Must equal the wasm-bindgen CLI used to generate the JS module (CI installs the same version).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# The editor's wasm (PW-8): optimised for size. Measured on the bridge, brotli-11: release
# 13,019,492 B; opt-level z + fat LTO 10,272,580 B (wasm-opt -Oz on top made both larger
# compressed, so it is not used). Native builds keep `release`.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"

# Page rendering stays fast: opt-level z made rendering 10 pages at 150 dpi 1.9x slower
# (928 -> 1,788 ms, headless Chromium). The PDF interpreter, rasteriser, font and codec crates
# keep opt-level 3; everything else (UI, tools, glue) is optimised for size.
[profile.web.package.hayro]
opt-level = 3
[profile.web.package."hayro-interpret"]
opt-level = 3
[profile.web.package."hayro-syntax"]
opt-level = 3
[profile.web.package."hayro-cmap"]
opt-level = 3
[profile.web.package."hayro-ccitt"]
opt-level = 3
[profile.web.package."hayro-jbig2"]
opt-level = 3
[profile.web.package."hayro-jpeg2000"]
opt-level = 3
[profile.web.package."hayro-postscript"]
opt-level = 3
[profile.web.package.vello_cpu]
opt-level = 3
[profile.web.package.vello_common]
opt-level = 3
[profile.web.package.fearless_simd]
opt-level = 3
[profile.web.package.kurbo]
opt-level = 3
[profile.web.package.peniko]
opt-level = 3
[profile.web.package.skrifa]
opt-level = 3
[profile.web.package."read-fonts"]
opt-level = 3
[profile.web.package."font-types"]
opt-level = 3
[profile.web.package."zune-core"]
opt-level = 3
[profile.web.package."zune-inflate"]
opt-level = 3
[profile.web.package."zune-jpeg"]
opt-level = 3
[profile.web.package."zune-jpegxl"]
opt-level = 3
[profile.web.package.miniz_oxide]
opt-level = 3
[profile.web.package."zlib-rs"]
opt-level = 3
[profile.web.package.flate2]
opt-level = 3
[profile.web.package."tiny-skia"]
opt-level = 3
[profile.web.package."tiny-skia-path"]
opt-level = 3

