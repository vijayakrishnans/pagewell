apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: pdf-jobs-worker-tests
  description: pdf-jobs-worker's tests (jobs through the real files-worker on real SQLite, a fake runner; rights, retries, limits, isolation), run on dev
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest declares
  # (tooling/catalog/gen-component-docs.mjs).
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: pagewell-jobs
  path: tests/pdf-jobs-worker
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: pagewell
    layer: test
